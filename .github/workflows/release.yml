name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (skip release-please)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release-please:
    if: ${{ github.event_name == 'push' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      # Monorepo mode: the action only emits per-path outputs for non-root
      # packages ("<path>--release_created"), plus the global releases_created /
      # paths_released. Gate publishing on the en16931 package specifically.
      release_created: ${{ steps.release.outputs['packages/en16931--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/en16931--tag_name'] }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: |
      !failure() && !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocker #0 guard: consumers must receive an engine with exact decimal
      # arithmetic. As long as the repo relies on a local patch
      # (patchedDependencies), a published package would resolve the unfixed
      # fontoxpath — refuse to publish, whatever triggered this job.
      # Bun hoists patchedDependencies to the workspace root, so check both the
      # root manifest and the package manifest.
      - name: Refuse to publish while depending on the local fontoxpath patch
        run: |
          for manifest in package.json packages/en16931/package.json; do
            if jq -e '.patchedDependencies' "$manifest" > /dev/null; then
              echo "::error::$manifest still uses patchedDependencies — switch the dependency to the published fontoxpath-exact-decimal fork before releasing (see BACKLOG.md, blocker #0)."
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary # local lockfile is v2 (bun 1.4 canary); pin stable once 1.4.0 ships

      - run: bun install --frozen-lockfile

      # The whole point of this package is its proof — never ship untested.
      # Run from the workspace root so every workspace package's tests must pass.
      - run: bun test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Auth: npm trusted publishing (OIDC) — configured on npmjs.com for this
      # repo + release.yml (the workflow FILENAME is part of the binding: never
      # rename this file). No token: the npm CLI exchanges the id-token itself.
      # Publish with cwd = the package directory rather than `npm -w`: the
      # trusted-publishing/provenance flow is exercised against a plain
      # `npm publish` in the package root, while `-w` re-resolves through the
      # workspace root and has a history of publish quirks. The binding does
      # not depend on cwd.
      - name: Publish en16931
        working-directory: packages/en16931
        run: npm publish --access public --provenance
