name: CI

# PRs run this workflow directly; pushes to main run it exactly once through
# release.yml (workflow_call) — no duplicate runs. Path filters are absent on
# purpose: this package's whole value is its proof, every job costs minutes,
# and a filter that skips the wrong job costs more than it saves.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Under workflow_call, github.workflow is the caller's name ("Release"), so
  # release runs and PR runs ("CI") never share a group. Only PR runs are
  # cancelled when superseded — release runs never are.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary # bun.lock is v2 (needs bun 1.4) — no stable 1.4.0 as of 2026-07-28 (latest stable is 1.3.14); pin the stable release once it ships
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .

  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary # bun.lock is v2 (needs bun 1.4) — no stable 1.4.0 as of 2026-07-28 (latest stable is 1.3.14); pin the stable release once it ships
      - run: bun install --frozen-lockfile
      # Fans out to each workspace package's own `tsc -p tsconfig.json`
      # (there is deliberately no root tsconfig.json).
      - run: bun run typecheck

  test:
    name: Runner tests (valid corpus + mutation corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary # bun.lock is v2 (needs bun 1.4) — no stable 1.4.0 as of 2026-07-28 (latest stable is 1.3.14); pin the stable release once it ships
      - run: bun install --frozen-lockfile
      - run: bun test

  integrity:
    name: cef/ artefacts byte-identical to vendored pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checksum of every vendored file
        working-directory: packages/en16931
        run: sha256sum --check --strict cef.SHA256SUMS
      - name: Refuse files present in cef/ but absent from the manifest
        working-directory: packages/en16931
        run: |
          find cef -type f ! -name VENDORED.md | LC_ALL=C sort > "$RUNNER_TEMP/cef-actual"
          sed 's/^[0-9a-f]\{64\}  //' cef.SHA256SUMS | LC_ALL=C sort > "$RUNNER_TEMP/cef-expected"
          diff -u "$RUNNER_TEMP/cef-expected" "$RUNNER_TEMP/cef-actual"
      # One canonical README: the npm-facing copy in packages/en16931 is
      # refreshed by prepack, but the committed copy must never drift from it.
      - name: README copy in packages/en16931 matches the canonical root README
        run: diff -q README.md packages/en16931/README.md

  build:
    name: Build + packaging checks (publint, attw, npm pack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary # bun.lock is v2 (needs bun 1.4) — no stable 1.4.0 as of 2026-07-28 (latest stable is 1.3.14); pin the stable release once it ships
      - run: bun install --frozen-lockfile
      - name: Build the package
        working-directory: packages/en16931
        run: bun run build
      - name: publint
        working-directory: packages/en16931
        run: bunx publint --strict
      - name: Are the types wrong (attw)
        working-directory: packages/en16931
        run: bunx @arethetypeswrong/cli --pack . --profile esm-only
      - name: npm pack sanity — dist, types and vendored artefacts must ship
        working-directory: packages/en16931
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          jq -e '
            [.[0].files[].path] as $f
            | ($f | index("dist/index.js")) != null
              and ($f | index("cef/LICENSE.txt")) != null
              and ($f | index("cef/VENDORED.md")) != null
              and ($f | index("cef/cii/schematron/preprocessed/EN16931-CII-validation-preprocessed.sch")) != null
              and ($f | index("cef/ubl/schematron/preprocessed/EN16931-UBL-validation-preprocessed.sch")) != null
              and (($f | map(select(endswith(".d.ts"))) | length) > 0)
          ' "$RUNNER_TEMP/pack.json" > /dev/null || {
            echo "::error::npm pack tarball is missing critical files (compiled dist, .d.ts, or vendored cef artefacts)"
            exit 1
          }
      # The only check that exercises what consumers actually receive: packs
      # the tarball, installs it into a scratch project on plain Node (no Bun,
      # no TypeScript), and validates a real invoice from the installed copy.
      - name: Consumer smoke test (npm pack → install → validate on plain Node)
        working-directory: packages/en16931
        run: node scripts/smoke.mjs

  parity:
    name: Assert-by-assert parity vs Java/Saxon reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      validator:
        # easybill/en16931-validator:0.6.0 pinned by manifest-list digest — the
        # reference implementation must be as immutable as the vendored artefacts.
        image: easybill/en16931-validator@sha256:ae44045472a9e42abb3986b452f29051b43fed6b37dae60421c2dd27c0cfb925
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary # bun.lock is v2 (needs bun 1.4) — no stable 1.4.0 as of 2026-07-28 (latest stable is 1.3.14); pin the stable release once it ships
      - run: bun install --frozen-lockfile
      - name: Wait for validator
        working-directory: packages/en16931
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/xml" \
              --data-binary @cef/cii/examples/CII_example1.xml http://localhost:8080/validation || true)
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          echo "validator did not become ready" && exit 1
      - name: Run parity
        working-directory: packages/en16931
        run: bun scripts/parity.ts

  zizmor:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor (offline, version-pinned)
        run: pipx run zizmor==1.28.0 --no-online-audits .
